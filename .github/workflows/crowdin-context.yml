name: "Crowdin context"

# Screenshots and per-string notes are what make a source string translatable. Uploading them by
# hand meant they arrived late or not at all, and a forgotten upload has no symptom — so this runs
# on every merge that could change them.
#
# The nightly run is not redundant: Crowdin pulls new strings from main on its own schedule, so a
# push-triggered run can upload screenshots before the strings they describe exist, and auto-tag
# silently matches nothing. Both steps are idempotent, so the nightly pass repairs that race.

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/public/assets/i18n/en.json"
      - "frontend/i18n-context.json"
      - "frontend/src/**/*.stories.ts"
      - "frontend/scripts/**"
      - ".github/workflows/crowdin-context.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A second run overlapping the first would race on delete-then-create for the same screenshot.
concurrency:
  group: crowdin-context
  cancel-in-progress: false

jobs:
  upload:
    name: Upload screenshots and context
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "frontend"
    env:
      CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
      CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - run: npm ci --force # tailwind 4 fails to resolve in angular-builder 19.1

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The capture reads the built story index to decide what to screenshot, so this is a
      # prerequisite rather than a convenience.
      - name: Build Storybook
        run: npm run build-storybook

      - name: Capture screenshots
        run: npm run i18n:screenshots

      - name: Upload screenshots
        run: npm run i18n:screenshots:upload

      - name: Upload per-string context
        run: npm run i18n:context

      - name: Keep the screenshots for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crowdin-screenshots
          path: crowdin/screenshots/
          retention-days: 7
          if-no-files-found: warn
