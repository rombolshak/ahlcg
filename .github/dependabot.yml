# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/frontend" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      security:
        applies-to: security-updates
        update-types:
          - "patch"
          - "minor"
      linters:
        applies-to: version-updates
        patterns:
          - "*lint*"
          - "*prettier*"
        update-types:
          - "major"
      vitest:
        applies-to: version-updates
        patterns:
          - "vitest"
          - "@vitest/*"
        exclude-patterns:
          - "@vitest/eslint-plugin"
        update-types:
          - "major"
      bugsnag:
        applies-to: version-updates
        patterns:
          - "@bugsnag/*"
        update-types:
          - "major"
    ignore:
      - dependency-name: "@angular*"
        update-types: [ "version-update:semver-major" ]

  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "nuget"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      dotnet:
        applies-to: version-updates
        patterns:
          - "Microsoft.*"
          - "AspNetCore.*"
          - "OpenTelemetry.*"
        update-types:
          - "major"
      aspire:
        applies-to: version-updates
        patterns:
          - "*Aspire.*"
        update-types:
          - "major"
    ignore:
      # A security pin on StreamJsonRpc's transitive dependency, which is built against 2.x
      - dependency-name: "MessagePack"
        update-types: [ "version-update:semver-major" ]

  - package-ecosystem: "dotnet-sdk"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      dotnet-sdk:
        applies-to: version-updates
        patterns:
          - "*"
