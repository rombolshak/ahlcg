<ng-container *transloco="let t; prefix: 'auth.sign_in'">
  @if (view() === "choice") {
    <p class="mb-6 text-base-content/80">{{ t("message") }}</p>

    <div class="grid grid-cols-2 gap-4">
      @for (choice of choices(); track choice.key) {
        <button
          type="button"
          class="card cursor-pointer bg-base-200 text-left transition card-border"
          [class.bg-primary]="$index === selectedIndex()"
          [disabled]="busy()"
          [attr.data-testId]="choice.key"
          (click)="choice.process()"
          (mouseenter)="selectedIndex.set($index)"
        >
          <div class="card-body">
            <h2 class="card-title">{{ t(`${choice.key}.title`) }}</h2>
            <p>{{ t(`${choice.key}.lead`) }}</p>
            <ul class="mt-2 list-disc pl-4 text-sm text-base-content/70">
              <li>{{ t(`${choice.key}.credentials`) }}</li>
              <li>{{ t(`${choice.key}.device`) }}</li>
              <li>{{ t(`${choice.key}.name`) }}</li>
              <li>{{ t(`${choice.key}.duration`) }}</li>
            </ul>
          </div>
        </button>
      }
    </div>

    @if (error(); as err) {
      <ng-container *transloco="let te; prefix: 'auth.credentials_form.errors'">
        <div role="alert" class="mt-4 alert alert-soft alert-error">
          @if (err.kind === "key") {
            <span>{{ te(err.key) }}</span>
          } @else {
            <span>{{ err.message }}</span>
          }
        </div>
      </ng-container>
    }
  } @else {
    <ah-credentials-form dismissKey="back" (result)="onFormResult($event)" />
  }
</ng-container>
