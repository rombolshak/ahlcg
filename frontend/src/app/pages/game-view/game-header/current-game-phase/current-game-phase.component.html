<ng-container *ahTransloco="scope; let t">
  <!-- eslint-disable-next-line @angular-eslint/template/no-inline-styles -->
  <div
    class="flex h-full min-w-80 flex-col items-center justify-center rounded-full bg-linear-to-b from-(--baseColor)/50 via-(--accentColor)/70 to-(--baseColor)/50 px-4"
    [style.--baseColor]="colorSet().baseColor"
    [style.--accentColor]="colorSet().accentColor"
  >
    <span class="text-xs/3"> {{ t("round") }} {{ roundNumber() }} </span>
    <span class="text-xl/5">
      {{ t(this.gamePhase()) }}
      @let entityTitle = actingEntityTitle();
      @if (entityTitle) {
        <ng-container *transloco="let tc">— {{ tc(entityTitle) }}</ng-container>
      }
    </span>
  </div>
</ng-container>
