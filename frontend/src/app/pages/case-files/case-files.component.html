<ng-container *ahTransloco="scope; let t">
  <div class="absolute inset-0 bg-zinc-900/60"></div>

  <div class="relative z-10 flex size-full flex-col items-center pt-10 text-primary-content">
    <div class="grid w-full grid-cols-[1fr_auto_1fr] items-center px-10">
      <button ah-art-button type="button" class="justify-self-start tracking-wide btn-lg" data-testId="back" (click)="goBack()">{{ t("back") }}</button>
      <div class="flex items-center gap-6">
        <span class="h-px w-[140px] bg-base-content/45"></span>
        <h1 class="font-[Conkordia] text-[52px] tracking-wide">{{ t("title") }}</h1>
        <span class="h-px w-[140px] bg-base-content/45"></span>
      </div>
    </div>

    <div class="mt-8 flex w-2xl flex-col items-center border-b border-base-content/20" role="tablist">
      <div class="flex">
        <button
          type="button"
          role="tab"
          data-testId="tab-recent"
          [attr.aria-selected]="tab() === 'recent'"
          [class]="recentTabClass()"
          (click)="selectTab('recent')"
        >
          {{ t("tabs.recent") }}
        </button>
        <button
          type="button"
          role="tab"
          data-testId="tab-archive"
          [attr.aria-selected]="tab() === 'archive'"
          [class]="archiveTabClass()"
          (click)="selectTab('archive')"
        >
          {{ t("tabs.archive") }}
        </button>
      </div>
    </div>

    <div class="mt-[68px] flex min-h-0 w-2xl flex-1 flex-col items-center">
      @if (isLoading()) {
        <div class="flex w-full flex-1 flex-col gap-4" data-testId="loading">
          <div class="h-[110px] w-full skeleton rounded-box opacity-80"></div>
          <div class="h-[110px] w-full skeleton rounded-box opacity-60"></div>
          <div class="h-[110px] w-full skeleton rounded-box opacity-40"></div>
          <div class="h-[110px] w-full skeleton rounded-box opacity-20"></div>
        </div>
      } @else if (hasFailed()) {
        <div class="flex w-full flex-1 flex-col items-center gap-8 pt-40">
          <ah-case-files-notice tone="error" data-testId="error" [heading]="t('error.title')" [message]="t('error.message')" />
          <button ah-art-button type="button" class="tracking-wide btn-lg btn-primary" data-testId="retry" (click)="retry()">{{ t("error.retry") }}</button>
        </div>
      } @else if (entries().length === 0) {
        <div class="flex w-full flex-1 flex-col items-center gap-8 pt-40">
          @if (tab() === "recent") {
            <ah-case-files-notice data-testId="empty" [heading]="t('empty.title')" [message]="t('empty.message')" />
            <button ah-art-button type="button" class="tracking-wide btn-lg btn-primary" data-testId="begin" (click)="goBack()">{{ t("empty.action") }}</button>
          } @else {
            <ah-case-files-notice data-testId="empty" [heading]="t('archive_empty.title')" [message]="t('archive_empty.message')" />
          }
        </div>
      } @else {
        <div class="case-files-scroll min-h-0 w-full flex-1 overflow-y-auto" data-testId="list">
          <div class="flex flex-col gap-4 p-1 pb-10">
            @for (game of entries(); track game.id) {
              <ah-case-file-card
                [game]="game"
                [active]="$index === navigation().selectedIndex()"
                (mouseenter)="navigation().selectedIndex.set($index)"
                (click)="open(game)"
              />
            }
          </div>
        </div>
      }
    </div>
  </div>
</ng-container>
