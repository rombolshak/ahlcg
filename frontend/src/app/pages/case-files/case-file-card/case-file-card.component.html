<div
  class="card w-full cursor-pointer bg-base-200 transition card-border"
  [class.ring-2]="active()"
  [class.ring-primary]="active()"
  [attr.data-testId]="game().id"
>
  <div *transloco="let t; prefix: 'case_files'" class="card-body">
    <h2 class="card-title">{{ t("opened", { date: openedAt() }) }}</h2>
    <p>{{ t("last_played", { date: lastPlayedAt() }) }}</p>
  </div>
</div>
