<div class="card w-full cursor-pointer bg-base-200 transition card-border" [class.active]="active()" [attr.data-testId]="game().id">
  <div *ahTransloco="scope; let t" class="card-body">
    <h2 class="card-title">{{ t("opened", { date: openedAt() }) }}</h2>
    <p>
      @if (completedAt(); as date) {
        {{ t("completed", { date }) }}
      } @else {
        {{ t("last_played", { date: lastPlayedAt() }) }}
      }
    </p>
  </div>
</div>
