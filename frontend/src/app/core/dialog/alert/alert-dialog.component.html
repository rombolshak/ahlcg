<ng-container *transloco="let t; scope: 'core/dialog/alert'; prefix: 'core/dialog/alert'">
  <p class="mb-6 text-center text-base-content/80">{{ message() }}</p>

  <div class="flex items-center justify-center">
    <button type="button" data-testId="ok" class="btn btn-primary" (click)="result.emit()">
      {{ okText() ?? t("ok") }}
    </button>
  </div>
</ng-container>
